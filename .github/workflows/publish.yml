name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  # OIDC token for npm Trusted Publishing (no long-lived npm token is stored).
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # npm detects the OIDC environment and exchanges it for a short-lived
      # publish credential; --provenance records the build attestation.
      - name: Publish
        run: npm publish --access public --provenance
